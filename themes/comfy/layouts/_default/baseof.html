<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ block "title" . }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
    {{ partial "head.html" . }}
</head>
<body>
    <div class="blog-wrap">
        <div class="blog-grid">
            {{ partial "sidebar.html" . }}
            <main class="main">
                {{ block "main" . }}{{ end }}
            </main>
        </div>
    </div>
    {{ partial "footer.html" . }}
</body>
</html>
